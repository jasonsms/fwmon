[package]
name = "fwmon"
version = "0.1.0"
edition = "2021"
description = "OpenWrt inbound (L4) connection monitor, complementary to fn-knock (L7)"
license = "MIT"
authors = ["fwmon"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tiny_http = "0.12"
flate2 = "1"
ctrlc = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
